        { text: "最后一道题：如果你的人生是一部B级片，片名会叫？", options: [
            { text: "《干就完了之末日狂奔》", scores: [3,0,0,0,0,2] },
            { text: "《玄学大爆炸》", scores: [0,3,0,0,0,2] },
            { text: "《社交亡灵骑士》", scores: [0,0,3,0,2,0] },
            { text: "《秩序与混乱的婚礼》", scores: [0,0,0,2,1,3] }
        ]}
    ];
    
    // ======================= 人格库（9种，targetScores 已微调，更符合特征） =======================
    const personalities = [
        { id: 0, name: "🔥 狂焰行者", desc: "你不是在解决问题，你是在把问题烧成灰烬。大脑的油门焊死了，刹车只是个装饰。别人犹豫“能不能做”，你只关心“什么时候做完”。对你来说，思考是拖延的借口，行动才是唯一的语法。", targetScores: [90, 30, 35, 15, 25, 70] },
        { id: 1, name: "🌀 玄门隐士", desc: "你活在现实的裂缝里，能听见电线杆的窃窃私语，也能读懂外卖小票上的命运密码。别人觉得你该去看医生，但你清楚地知道：巧合是宇宙的母语。", targetScores: [25, 95, 20, 35, 50, 80] },
        { id: 2, name: "🫂 胶水怪人", desc: "你的社交天赋属于魔法侧——能在葬礼上把人逗笑，也能在电梯里让社恐开口。你不是在交朋友，你是在织网，而所有人都是心甘情愿粘上来的飞虫。", targetScores: [40, 25, 98, 15, 80, 45] },
        { id: 3, name: "📐 秩序判官", desc: "你的灵魂是一张无限延长的Excel表，每一个喷嚏都要被归类到子目录下。混乱是你唯一无法容忍的脏话。你相信只要规则足够细，连爱情都能被标准化生产。", targetScores: [35, 15, 25, 100, 20, 20] },
        { id: 4, name: "💞 共振灵媒", desc: "你不是在听别人说话，你是在直接读取对方的情绪内存。你能从一句“我没事”里挖出三层崩溃。共情对你来说不是能力，是诅咒。", targetScores: [20, 55, 70, 25, 98, 35] },
        { id: 5, name: "🎭 荒诞诗人", desc: "你崇拜无意义，就像别人崇拜成功。你相信最深刻的真理往往长着一张笑话的脸。逻辑对你来说是捆仙绳，而你是那只咬断绳子的猴子。", targetScores: [45, 65, 40, 10, 35, 100] },
        { id: 6, name: "⚙️ 矛盾聚合体", desc: "你身体里住着三个互相拉黑的灵魂：一个想早睡，一个想通宵，还有一个想出家。你不是善变，你是拒绝被任何单一标签收编。", targetScores: [70, 70, 60, 60, 70, 70] },
        { id: 7, name: "🌿 寂静观测者", desc: "你像一台装了情感传感器的监控摄像头。你看着世界吵闹，偶尔在内心弹幕里疯狂吐槽，但脸上只有“已读不回”的表情。", targetScores: [15, 75, 20, 65, 65, 55] },
        { id: 8, name: "🍄 怪诞冒险家", desc: "你的好奇心比猫命还多一条。别人觉得危险的地方，你看到的是游乐场；别人觉得无聊的东西，你能玩出三个隐藏关卡。", targetScores: [85, 70, 55, 25, 45, 90] }
    ];
    
    // 补充每个人格的“行动指南”和“盲点”（用于高级解析）
    const personalityAdvice = {
        "🔥 狂焰行者": { strength: "行动力极强，能快速推动事情。", blind: "容易忽略细节和他人感受，可能会撞南墙。", advice: "每次行动前深呼吸3秒，问自己：这是最优解吗？" },
        "🌀 玄门隐士": { strength: "洞察力超群，能发现隐藏规律。", blind: "容易沉浸在自己的世界里，与现实脱节。", advice: "每周选一天完全用逻辑思考，平衡直觉。" },
        "🫂 胶水怪人": { strength: "人脉广，感染力强。", blind: "过度依赖社交认可，独处时容易焦虑。", advice: "练习享受独处，培养一个不需要观众的爱好。" },
        "📐 秩序判官": { strength: "高效、可靠，能完成复杂计划。", blind: "缺乏灵活性，难以应对突发变化。", advice: "故意留出20%的弹性时间，接受不完美。" },
        "💞 共振灵媒": { strength: "善解人意，治愈力强。", blind: "容易情绪过载，忘记照顾自己。", advice: "每天设定“情绪隔离时间”，只关注自己的感受。" },
        "🎭 荒诞诗人": { strength: "创意无限，能化解尴尬。", blind: "可能让人觉得不靠谱或难以预测。", advice: "把荒诞点子记录在案，每月选一个实现。" },
        "⚙️ 矛盾聚合体": { strength: "适应力极强，能处理矛盾。", blind: "容易内耗，决策困难。", advice: "建立简单的决策规则（比如硬币法），减少纠结。" },
        "🌿 寂静观测者": { strength: "冷静、客观，擅长分析。", blind: "可能被误解为冷漠或不合群。", advice: "偶尔主动表达感受，哪怕只说一句。" },
        "🍄 怪诞冒险家": { strength: "探索精神，总能发现新乐趣。", blind: "风险意识弱，容易受伤或闯祸。", advice: "冒险前做一次“最坏情况推演”，带上安全绳。" }
    };
    
    // ======================= 绘制像素头像（保持不变） =======================
    function drawPixelAvatar(ctx, typeId, size=96) {
        const cell = size / 16;
        ctx.clearRect(0, 0, size, size);
        ctx.fillStyle = "#2b2b2b";
        ctx.fillRect(0, 0, size, size);
        ctx.fillStyle = "#f7cf9f";
        for(let y=4; y<12; y++) for(let x=4; x<12; x++) ctx.fillRect(x*cell, y*cell, cell, cell);
        ctx.fillStyle = "#1f1a14";
        const eyeX = [5,10];
        const eyeY = 6;
        if(typeId === 0){ ctx.fillStyle = "#e34d2b"; }
        else if(typeId === 1){ ctx.fillStyle = "#aa6dc9"; }
        else if(typeId === 2){ ctx.fillStyle = "#4a708b"; }
        else { ctx.fillStyle = "#1f1a14"; }
        eyeX.forEach(x => ctx.fillRect(x*cell, eyeY*cell, cell*1.5, cell*1.5));
        ctx.fillStyle = "#6b3e1a";
        let mouthY = 10;
        if(typeId === 3) mouthY = 9;
        if(typeId === 4) ctx.fillStyle = "#d45b5b";
        if(typeId === 5) ctx.fillRect(6*cell, mouthY*cell, cell*4, cell);
        else if(typeId === 6) ctx.fillRect(5*cell, mouthY*cell, cell*6, cell*0.8);
        else ctx.fillRect(6*cell, mouthY*cell, cell*4, cell*0.8);
        if(typeId === 0) ctx.fillStyle = "#ff8024";
        else if(typeId === 1) ctx.fillStyle = "#ad6eff";
        else if(typeId === 7) ctx.fillStyle = "#789048";
        else ctx.fillStyle = "#b87c4f";
        ctx.fillRect(4*cell, 2*cell, cell*8, cell*2);
        if(typeId === 2) { ctx.fillStyle = "#ffb347"; ctx.fillRect(2*cell,3*cell,cell*3,cell*3); }
        if(typeId === 8) { ctx.fillStyle = "#77aa55"; ctx.fillRect(11*cell,4*cell,cell*3,cell*4); }
    }
    
    // ======================= 全局变量 =======================
    let currentIndex = 0, userScores = [0,0,0,0,0,0], totalQuestions = questions.length;
    const questionCounterSpan = document.getElementById("question-counter"), progressTip = document.getElementById("progress-tip");
    
    function renderCurrentQuestion() {
        if(currentIndex >= totalQuestions){ computeAndShowResult(); return; }
        const q = questions[currentIndex];
        questionCounterSpan.innerText = `第${currentIndex+1} / ${totalQuestions}题`;
        progressTip.innerText = `🧠 直觉作答 · 维度活跃中`;
        document.getElementById("question-text").innerText = q.text;
        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";
        q.options.forEach(opt => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt.text;
            btn.addEventListener("click", () => {
                for(let i=0;i<6;i++) userScores[i] += opt.scores[i];
                currentIndex++;
                renderCurrentQuestion();
            });
            optionsContainer.appendChild(btn);
        });
    }
    
    // 归一化到0-100
    function normalizeScores(scores){ const maxPossible = 3 * totalQuestions; return scores.map(s => Math.min(100, Math.floor((s / maxPossible) * 100))); }
    
    // 改进的匹配算法：混合加权欧氏距离 + 余弦相似度，并返回所有人格的得分（越小越匹配）
    function getAllPersonalityScores(normUser) {
        let scoresList = [];
        for(let i=0; i<personalities.length; i++) {
            const target = personalities[i].targetScores;
            // 欧氏距离（归一化到0-1范围，最大可能距离为 sqrt(6*100^2)=244.9）
            let euclid = 0;
            for(let d=0; d<6; d++) {
                let diff = normUser[d] - target[d];
                euclid += diff * diff;
            }
            euclid = Math.sqrt(euclid) / 244.9; // 归一化
            // 余弦相似度（范围-1到1，转为距离 1-sim）
            let dot=0, magU=0, magT=0;
            for(let d=0; d<6; d++) {
                dot += normUser[d] * target[d];
                magU += normUser[d] * normUser[d];
                magT += target[d] * target[d];
            }
            let cosSim = dot / (Math.sqrt(magU)*Math.sqrt(magT) + 1e-6);
            let cosDist = 1 - Math.max(0, cosSim); // 只考虑正向相似
            // 混合分数：欧氏距离权重0.4，余弦距离权重0.6（余弦更关注方向）
            let hybrid = euclid * 0.4 + cosDist * 0.6;
            scoresList.push({ idx: i, score: hybrid, name: personalities[i].name, targetScores: target });
        }
        scoresList.sort((a,b) => a.score - b.score);
        return scoresList;
    }
    
    function computeAndShowResult(){
        const normUser = normalizeScores(userScores);
        const sorted = getAllPersonalityScores(normUser);
        const best = sorted[0];
        const second = sorted[1];
        const matched = personalities[best.idx];
        const secondMatch = personalities[second.idx];
        
        // 计算匹配率（基于混合分数，分数越低匹配越高，映射到70-99%）
        const matchPercent = Math.floor(99 - (best.score * 30));
        const matchDisplay = Math.min(99, Math.max(70, matchPercent));
        
        // 构建每个维度的详细得分和解读
        let dimDetails = "";
        for(let i=0; i<DIM_NAMES.length; i++) {
            const dim = DIM_NAMES[i];
            const score = normUser[i];
            const insight = DIM_INSIGHTS[dim];
            const level = score >= 70 ? "高" : (score <= 30 ? "低" : "中");
            const desc = score >= 70 ? insight.high : (score <= 30 ? insight.low : "你的这项特质比较均衡，可根据场景灵活切换。");
            dimDetails += `<div style="margin-bottom: 12px;">
                <strong>${dim}</strong> <span class="score-badge">${score}分</span>
                <div style="background:#e0d5c0; border-radius: 10px; margin: 5px 0; height: 6px;"><div style="width:${score}%; background:#e2a56a; height:6px; border-radius:10px;"></div></div>
                <div class="dim-detail">${desc}</div>
                <div class="dim-detail">💡 ${insight.advice}</div>
            </div>`;
        }
        
        // 人格深度解读（优势、盲点、建议）
        const adv = personalityAdvice[matched.name] || { strength: "独特而复杂", blind: "有时难以被理解", advice: "接纳自己的多面性" };
        
        const mainCard = document.querySelector(".quiz-card");
        let dimHtml = `<div class="dim-explanation">`;
        for(let i=0;i<DIM_NAMES.length;i++){ dimHtml += `<p><strong>${DIM_NAMES[i]}</strong> ${DIM_EXPLANATIONS[DIM_NAMES[i]]}</p>`; }
        dimHtml += `</div>`;
        
        mainCard.innerHTML = `
            <div class="result-box">
                <div class="pixel-art"><canvas id="pixelCanvas" class="pixel-avatar" width="128" height="128" style="width:128px;height:128px;image-rendering:pixelated;"></canvas></div>
                <div class="result-name">${matched.name}</div>
                <div class="result-desc">
                    <p>✨ ${matched.desc}</p>
                    <p style="margin-top:12px;font-size:0.9rem;">⚡ 匹配率 ${matchDisplay}% · 基于六维深度拟合</p>
                </div>
                <div class="radar-container"><canvas id="radarCanvas" width="300" height="300" style="width:100%;height:auto;max-width:300px"></canvas></div>
                
                <div class="insight-card">
                    <strong>📊 你的六维分析</strong>
                    ${dimDetails}
                </div>
                
                <div class="insight-card">
                    <strong>🌟 人格深度解读</strong><br>
                    <strong>优势：</strong> ${adv.strength}<br>
                    <strong>潜在盲点：</strong> ${adv.blind}<br>
                    <strong>🎯 行动锦囊：</strong> ${adv.advice}
                </div>
                
                <div class="second-match">
                    🔍 与你第二相似的人格：<strong>${secondMatch.name}</strong><br>
                    差异维度：你比${secondMatch.name}更偏向 ${getTopDiffDim(normUser, secondMatch.targetScores)}
                </div>
                
                ${dimHtml}
                <div style="display: flex; justify-content: center; gap: 12px; margin-top: 20px;">
                    <button class="restart-btn" id="restartBtn">⟳ 重开奇境</button>
                    <button class="gallery-btn" id="galleryBtn">📸 查看我们的相册</button>
                </div>
            </div>
        `;
        
        // 辅助函数：找差异最大的维度
        function getTopDiffDim(user, target) {
            let maxDiff = -1, maxDim = "";
            for(let i=0;i<DIM_NAMES.length;i++) {
                let diff = Math.abs(user[i] - target[i]);
                if(diff > maxDiff) {
                    maxDiff = diff;
                    maxDim = DIM_NAMES[i];
                }
            }
            return maxDim;
        }
        
        const pixelCanvas = document.getElementById("pixelCanvas");
        const ctx = pixelCanvas.getContext("2d");
        drawPixelAvatar(ctx, matched.id, 128);
        const radarCtx = document.getElementById("radarCanvas").getContext("2d");
        new Chart(radarCtx, {
            type: 'radar',
            data: { labels: DIM_NAMES, datasets: [{ label: '你的荒诞六维', data: normUser, backgroundColor: 'rgba(235, 140, 80, 0.3)', borderColor: '#c2612c', borderWidth: 2, pointBackgroundColor: '#e38b4a', pointBorderColor: '#fff', pointRadius: 4 }] },
            options: { responsive: true, maintainAspectRatio: true, scales: { r: { beginAtZero: true, max: 100, ticks: { stepSize: 20, display: false }, pointLabels: { display: true, font: { size: 12 } } } }, plugins: { legend: { position: 'top' }, tooltip: { callbacks: { label: (ctx) => `${ctx.label}: ${ctx.raw}分` } } } }
        });
        document.getElementById("restartBtn").addEventListener("click", () => location.reload());
        document.getElementById("galleryBtn").addEventListener("click", () => { window.location.href = "gallery.html"; });
    }
    
    function init(){ userScores = [0,0,0,0,0,0]; currentIndex = 0; renderCurrentQuestion(); }
    init();
</script>
